---
# Example inventory: placeholder host names only. The real inventory lives in AWX
# (or a gitignored local/ copy). Keep the group name; the play in site.yml keys off it.
all:
  children:
    windows:
      hosts:
        win-01.lab.example.com:
        w11-01.lab.example.com:
      vars:
        ansible_connection: psrp
        ansible_psrp_auth: kerberos
        ansible_psrp_protocol: https
        ans_features_openssh_server: present
        ans_features_telnet_client: present
